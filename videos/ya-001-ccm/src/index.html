<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>YA-001 · CCM — מעל העננים</title>
<style>
@font-face { font-family: 'Assistant'; font-weight: 300; src: url(fonts/assistant-hebrew-300-normal.woff2) format('woff2'); unicode-range: U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F; }
@font-face { font-family: 'Assistant'; font-weight: 600; src: url(fonts/assistant-hebrew-600-normal.woff2) format('woff2'); unicode-range: U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F; }
@font-face { font-family: 'Assistant'; font-weight: 800; src: url(fonts/assistant-hebrew-800-normal.woff2) format('woff2'); unicode-range: U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F; }
@font-face { font-family: 'Assistant'; font-weight: 300; src: url(fonts/assistant-latin-300-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF; }
@font-face { font-family: 'Assistant'; font-weight: 600; src: url(fonts/assistant-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF; }
@font-face { font-family: 'Assistant'; font-weight: 800; src: url(fonts/assistant-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF; }
@font-face { font-family: 'Anton'; font-weight: 400; src: url(fonts/anton-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Oswald'; font-weight: 200; src: url(fonts/oswald-latin-200-normal.woff2) format('woff2'); }
@font-face { font-family: 'Oswald'; font-weight: 300; src: url(fonts/oswald-latin-300-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url(fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); }

:root {
  --cloud: #FFFFFF; --dawn: #FFE8EF; --sunrise-pink: #EE6A92; --pink-deep: #A8264F;
  --sun-gold: #FFC53D; --sea: #19B8C9; --sky: #8EC3F2; --open-sky: #2F6FD6;
  --deep-sky: #0B2A5B; --muted: #4A6285; --scrim: #061A48;
  --card-shadow: 0 20px 40px -24px rgba(6,26,72,.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--deep-sky); overflow: hidden; }
body { font-family: 'Assistant', sans-serif; color: var(--deep-sky); -webkit-font-smoothing: antialiased; }
#stage { position: relative; overflow: hidden; background: var(--cloud); }
.A #stage { width: 1920px; height: 1080px; }
.B #stage { width: 1080px; height: 1920px; }
.layer, .abs { position: absolute; inset: 0; }
.abs { inset: auto; }
canvas { display: block; }
bdi, .iso { unicode-bidi: isolate; }
.mono { font-family: 'IBM Plex Mono', monospace; font-weight: 600; direction: ltr; unicode-bidi: isolate; }

/* ---------- sky by altitude ---------- */
#bg .sky { position: absolute; inset: 0; opacity: 0; }
#sky-fog { background:
  radial-gradient(120% 70% at 70% 100%, rgba(255,232,239,.95) 0%, rgba(255,232,239,0) 60%),
  radial-gradient(90% 60% at 20% 10%, rgba(142,195,242,.35) 0%, rgba(142,195,242,0) 70%),
  linear-gradient(180deg, rgba(74,98,133,.16) 0%, rgba(255,255,255,1) 55%, rgba(255,232,239,1) 100%), var(--cloud); }
#sky-tops { background:
  radial-gradient(80% 40% at 50% 92%, rgba(238,106,146,.30) 0%, rgba(238,106,146,0) 70%),
  linear-gradient(180deg, var(--sky) 0%, rgba(142,195,242,.55) 45%, var(--dawn) 80%, var(--cloud) 100%); }
#sky-low { background:
  linear-gradient(180deg, var(--open-sky) 0%, var(--sky) 55%, var(--cloud) 100%); }
#sky-deep { background:
  radial-gradient(70% 50% at 50% 115%, rgba(25,184,201,.35) 0%, rgba(25,184,201,0) 70%),
  linear-gradient(180deg, var(--scrim) 0%, var(--deep-sky) 50%, var(--open-sky) 100%); }
#sky-strat { background: linear-gradient(180deg, var(--scrim) 0%, var(--scrim) 35%, var(--deep-sky) 100%); }
#sky-sunrise { background:
  radial-gradient(60% 30% at 50% 82%, rgba(255,197,61,1) 0%, rgba(255,197,61,.55) 35%, rgba(255,197,61,0) 75%),
  linear-gradient(180deg, var(--deep-sky) 0%, var(--open-sky) 32%, var(--sky) 58%, rgba(255,197,61,.85) 82%, var(--cloud) 100%); }
#stars, #earth, #contrail, #horizon { position: absolute; }
#horizon { height: 3px; background: linear-gradient(90deg, rgba(255,197,61,0), var(--sun-gold) 20%, var(--sun-gold) 80%, rgba(255,197,61,0)); left: 0; right: 0; }
#clouds img, #sea img, #trans img { position: absolute; will-change: transform; }

/* ---------- cards ---------- */
.card { position: absolute; background: var(--cloud); border: 2.5px solid var(--deep-sky);
  border-radius: 36px 36px 36px 6px; box-shadow: var(--card-shadow); }
.hl { padding: 40px 56px 46px; text-align: right; }
.A .hl { right: 120px; top: 230px; width: 880px; }
.B .hl { right: 120px; left: 100px; top: 330px; }
.l1 { font-weight: 800; color: var(--deep-sky); }
.l2 { font-weight: 300; color: var(--open-sky); margin-top: 10px; }
.A .l1 { font-size: 84px; line-height: 1.08; }
.A .l2 { font-size: 62px; line-height: 1.15; }
.B .l1 { font-size: 72px; line-height: 1.1; }
.B .l2 { font-size: 54px; line-height: 1.18; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0 .08em; margin-bottom: -.08em; }
.wi { display: inline-block; direction: rtl; unicode-bidi: isolate; }
.mark { display: inline-block; position: relative; }
.mark > .mbg { position: absolute; inset: .12em -.12em .02em -.12em; background: var(--sun-gold); transform-origin: 100% 50%; z-index: 0; border-radius: 4px; }
.mark > .w { position: relative; z-index: 1; }

.vis { position: absolute; }
.A .vis { left: 160px; top: 170px; width: 760px; height: 660px; }
.B .vis { left: 100px; right: 120px; top: 830px; height: 540px; }
.float { position: absolute; inset: 0; }

.chip { display: inline-block; background: var(--cloud); border: 2.5px solid var(--deep-sky); border-radius: 999px;
  color: var(--deep-sky); white-space: nowrap; }
.A .chip { font-size: 30px; padding: 10px 26px; }
.B .chip { font-size: 44px; padding: 10px 30px; }

svg.icon { overflow: visible; color: var(--deep-sky); }
#link svg.icon { color: inherit; }
svg.icon .st { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
svg.icon .gold { fill: var(--sun-gold); stroke: var(--deep-sky); stroke-width: 1.2; }

.code { direction: ltr; text-align: left; white-space: pre; color: var(--deep-sky); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.A .code { font-size: 34px; line-height: 1.42; padding: 40px 48px; }
.B .code { font-size: 44px; line-height: 1.28; padding: 34px 36px; }
.caret { display: inline-block; width: .55em; height: 1.05em; background: var(--open-sky); vertical-align: -.18em; }

.notam { padding: 26px 40px 30px 52px; text-align: right; border-left: 12px solid var(--sunrise-pink); }
.notam .tag { display: block; color: var(--pink-deep); text-align: left; }
.notam .txt { font-weight: 600; color: var(--deep-sky); }
.A .notam { right: 120px; width: 880px; }
.A .notam .tag { font-size: 24px; } .A .notam .txt { font-size: 50px; line-height: 1.18; }
.B .notam { right: 120px; left: 100px; }
.B .notam .tag { font-size: 44px; } .B .notam .txt { font-size: 60px; line-height: 1.18; }

.readout { position: absolute; text-align: center; }
.readout .lab { color: var(--muted); display: block; }
.readout .val { color: var(--deep-sky); display: block; }
.A .readout .lab { font-size: 24px; } .A .readout .val { font-size: 76px; line-height: 1.1; }

/* ---------- chrome ---------- */
#chrome { pointer-events: none; color: var(--deep-sky); }
#chrome .rule { position: absolute; height: 1.5px; background: currentColor; opacity: .55; }
#chrome .ct { position: absolute; white-space: nowrap; }
.A #chrome .ct { font-size: 22px; }
.B #chrome .ct { font-size: 44px; }
.wordmark .yuv { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: .02em; }
.wordmark .ai { font-family: 'Oswald', sans-serif; font-weight: 200; }
.arrow { display: inline-block; width: 1.1em; height: .7em; vertical-align: .02em; }
.arrow path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

#vignette { background: radial-gradient(120% 120% at 50% 50%, rgba(6,26,72,0) 60%, rgba(6,26,72,.28) 100%); pointer-events: none; }
#grain { opacity: .07; mix-blend-mode: overlay; background-size: 256px 256px; pointer-events: none; }
#flash { background: radial-gradient(70% 70% at 50% 50%, rgba(255,255,255,1) 0%, rgba(255,255,255,.92) 45%, rgba(255,232,239,.85) 100%); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer">
    <div class="sky" id="sky-fog"></div>
    <div class="sky" id="sky-tops"></div>
    <div class="sky" id="sky-low"></div>
    <div class="sky" id="sky-deep"></div>
    <div class="sky" id="sky-strat"></div>
    <div class="sky" id="sky-sunrise"></div>
    <canvas id="stars"></canvas>
    <canvas id="contrail"></canvas>
    <canvas id="earth"></canvas>
    <div id="horizon"></div>
  </div>
  <div id="clouds" class="layer"></div>
  <div id="sea" class="layer"></div>
  <div id="link" class="layer"></div>
  <div id="route" class="layer"></div>
  <div id="shots" class="layer"></div>
  <div id="notams" class="layer"></div>
  <div id="trans" class="layer"><div id="flash" class="layer"></div></div>
  <div id="chrome" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <div id="grain" class="layer"></div>
</div>
<script src="gsap.min.js"></script>
<script src="timing.js"></script>
<script src="main.js"></script>
</body>
</html>
