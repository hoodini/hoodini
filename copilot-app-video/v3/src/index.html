<script>
gsap.registerPlugin(TextPlugin);
const FPS=30, TLD=window.TL, CUES=[], CUTS=[];
const tl=gsap.timeline({paused:true});
const norm=w=>w.toLowerCase().replace(/[^a-z0-9]/g,'');
function Wd(key,word,n=1){const ws=TLD.words[key];let c=0;for(const x of ws){if(norm(x.w).startsWith(norm(word))&&++c===n)return x}throw Error('W miss '+key+':'+word+'#'+n)}
const W=(k,w,n)=>Wd(k,w,n).s, WE=(k,w,n)=>Wd(k,w,n).e;
const L=k=>TLD.lines[k].start, LE=k=>TLD.lines[k].end, END=TLD.total;
const cue=(t,type,extra={})=>CUES.push(Object.assign({t:+t.toFixed(3),type},extra));
let seed=42;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const I=(n,cls='')=>`<span class="ico ${cls}">${ICON[n]}</span>`;
const world=document.getElementById('world'), fx=document.getElementById('fx');
const NEON=['#A3E635','#22D3EE','#A855F7','#FF2E88','#FBBF24'];
let uid=0;
const SECS={cold:'01',pain:'02',turn:'03',reveal:'04',mywork:'05',worktree:'06',merge:'07',power:'08',honest:'09',next:'10',end:'11'};
const SECNAME={cold:'2:07 AM',pain:'THE PAIN',turn:'PLOT TWIST',reveal:'GITHUB COPILOT APP',mywork:'MY WORK',worktree:'WORKTREES',merge:'AGENT MERGE',power:'POWER MOVES',honest:'THE CATCH',next:'SHIPPING NEXT',end:'5:00 PM'};
function SHOT(sec,t0,t1,theme,html,build,opt={}){
  const id='s'+(++uid);const el=document.createElement('div');el.className='shot t-'+theme;el.id=id;
  el.innerHTML=`<div class="punch">${html}</div>`;world.appendChild(el);
  tl.set(el,{visibility:'visible'},t0);tl.set(el,{visibility:'hidden'},t1);
  tl.fromTo(el.querySelector('.punch'),{scale:opt.zin?1.18:1.0},{scale:opt.zin?1:1.06,ease:opt.zin?'expo.out':'none',duration:opt.zin?.6:t1-t0,immediateRender:false},t0);
  CUTS.push({t:t0,t1,id,theme,sec,rain:opt.rain||theme==='matrix',mesh:opt.mesh||theme==='neon'||theme==='matrix'});cue(t0,'cut');
  const q=s=>el.querySelectorAll(s);
  if(build)build(q,t0,t1,el);
  const d=t1-t0, soft=!!opt.nojump;if(d>2.2&&!opt.still){const n=Math.floor(d/(soft?1.4:1.3));for(let k=1;k<=n;k++){const tj=t0+d*k/(n+1);const on=k%2===1;
    tl.set(el,{scale:on?(soft?1.045:1.1):1,rotation:on&&!soft?(k%4===1?-1.2:1.2):0,transformOrigin:'50% 48%'},tj);cue(tj,'cut')}}
  return el;
}
// ---- helpers (one tween per element/property)
const slam=(t,els,d=.34)=>{tl.fromTo(els,{scale:2.1,opacity:0,rotation:-4},{scale:1,opacity:1,rotation:0,duration:d,ease:'expo.out',stagger:.06,immediateRender:false},t);cue(t,'slam')};
const pop=(t,els,st=.07,snd=true)=>{tl.fromTo(els,{scale:0,opacity:0},{scale:1,opacity:1,duration:.38,ease:'back.out(2.6)',stagger:st,immediateRender:false},t);if(snd){const n=els.length||1;for(let i=0;i<Math.min(n,6);i++)cue(t+i*st,'pop')}};
const up=(t,els,st=.06)=>{tl.fromTo(els,{yPercent:120,rotation:6},{yPercent:0,rotation:0,duration:.45,ease:'power4.out',stagger:st,immediateRender:false},t);cue(t,'whoosh')};
const fade=(t,els,d=.3)=>tl.fromTo(els,{opacity:0},{opacity:1,duration:d,ease:'none',immediateRender:false},t);
const slideX=(t,els,x=-160,st=.06)=>tl.fromTo(els,{x,opacity:0},{x:0,opacity:1,duration:.45,ease:'power3.out',stagger:st,immediateRender:false},t);
const fly3d=(t,els,from={},d=.8)=>{tl.fromTo(els,Object.assign({z:-1800,rotationY:-60,rotationX:25,opacity:0},from),{z:0,rotationY:0,rotationX:0,opacity:1,duration:d,ease:'expo.out',stagger:.08,immediateRender:false},t);cue(t,'whoosh')};
const draw=(t,els,d=.5)=>{tl.fromTo(els,{strokeDashoffset:1},{strokeDashoffset:0,duration:d,ease:'power2.inOut',immediateRender:false},t);cue(t,'scribble')};
const type=(t,el,text,d)=>{d=d||Math.min(1.4,text.length*.035);tl.fromTo(el,{text:''},{text:{value:text},duration:d,ease:'none',immediateRender:false},t);cue(t,'keys',{d})};
const count=(t,el,a,b,d,fmt=v=>Math.round(v))=>{const o={v:a};tl.fromTo(o,{v:a},{v:b,duration:d,ease:'power2.out',immediateRender:false,onUpdate:()=>el.textContent=fmt(o.v)},t)};
const sticker=(t,el,rot=-6)=>{tl.fromTo(el,{scale:0,rotation:rot-30,opacity:0},{scale:1,rotation:rot,opacity:1,duration:.5,ease:'back.out(2.4)',immediateRender:false},t);cue(t,'pop2')};
const toast=(t,el)=>{tl.fromTo(el,{xPercent:150},{xPercent:0,duration:.45,ease:'expo.out',immediateRender:false},t);cue(t,'toast')};
const flash=(t,c='#fff',o=.9)=>{const f=document.createElement('div');f.className='flash';f.style.background=c;fx.appendChild(f);tl.fromTo(f,{opacity:o},{opacity:0,duration:.3,ease:'power2.out',immediateRender:false},t)};
const shake=(t,el,amt=16,d=.4)=>{const o={p:0};tl.fromTo(o,{p:0},{p:1,duration:d,ease:'none',immediateRender:false,onUpdate:()=>{const p=o.p;el.style.translate=`${Math.sin(p*70)*amt*(1-p)}px ${Math.cos(p*53)*amt*.6*(1-p)}px`}},t)};
// particle burst — deterministic
function burst(t,x,y,n=36,cols=NEON,spread=520,size=[8,22]){for(let i=0;i<n;i++){const p=document.createElement('div');p.className='pt';const s=size[0]+rnd()*(size[1]-size[0]);const c=cols[i%cols.length];
  p.style.cssText+=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${c};box-shadow:0 0 ${s}px ${c};opacity:0`;fx.appendChild(p);
  const a=rnd()*Math.PI*2,r=spread*(.35+rnd()*.65);tl.fromTo(p,{x:0,y:0,opacity:1,scale:1},{x:Math.cos(a)*r,y:Math.sin(a)*r+60,opacity:0,scale:.2,duration:.8+rnd()*.4,ease:'expo.out',immediateRender:false},t)}}
function confetti(t,n=90){for(let i=0;i<n;i++){const p=document.createElement('div');p.className='pt';const w=10+rnd()*14,h=w*(.4+rnd()*.6),c=NEON[i%5];
  p.style.cssText+=`left:${rnd()*1920}px;top:-40px;width:${w}px;height:${h}px;border-radius:3px;background:${c};opacity:0`;fx.appendChild(p);
  tl.fromTo(p,{y:0,rotation:0,opacity:1},{y:1150+rnd()*200,rotation:(rnd()-.5)*900,x:(rnd()-.5)*300,opacity:1,duration:1.6+rnd()*.8,ease:'power1.in',immediateRender:false},t+rnd()*.25);tl.set(p,{opacity:0},t+2.8)}}
const glitch=(txt)=>`<span class="glitch"><span>${txt}</span><span class="gA">${txt}</span><span class="gB">${txt}</span></span>`;
function glitchAnim(t,d,q,amt=14){const A=q('.gA'),B=q('.gB');const o={p:0};tl.fromTo(o,{p:0},{p:1,duration:d,ease:'none',immediateRender:false,onUpdate:()=>{const k=Math.floor(o.p*d*24);const j=(Math.sin(k*12.9898)*43758.5453)%1;
  A.forEach(e=>e.style.transform=`translate(${(j*2-1)*amt}px,${(j*3%1-.5)*amt*.4}px)`);B.forEach(e=>e.style.transform=`translate(${-(j*2-1)*amt}px,${(j*5%1-.5)*amt*.4}px)`)}},t)}
const circle=(w,h,col='var(--li)')=>`<svg class="hand" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke="${col}" d="M${w*.52},${h*.06} C${w*.9},${h*.02} ${w*1.0},${h*.45} ${w*.93},${h*.72} C${w*.84},${h*1.0} ${w*.18},${h*1.02} ${w*.05},${h*.66} C${-w*.03},${h*.35} ${w*.2},${h*.03} ${w*.6},${h*.1}"/></svg>`;
const CURSOR=`<svg viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
const TL3=['#FF5F57','#FEBC2E','#28C840'];
const MAC=(title,inner,w,h,style='')=>`<div class="mac" style="width:${w}px;height:${h}px;${style}"><div class="mbar">${TL3.map(c=>`<i style="background:${c}"></i>`).join('')}<span>${title}</span></div>${inner}</div>`;

<script>
// ---- kinetic captions (≤4 words per chunk)
const CHUNKS=[];
for(const k of Object.keys(TLD.words)){let cur=[];const ws=TLD.words[k];
  ws.forEach((w,i)=>{cur.push(w);const brk=/[,.:?!]$/.test(w.w)||cur.length>=4;if(brk||i===ws.length-1){CHUNKS.push({s:cur[0].s,e:cur[cur.length-1].e,ws:cur});cur=[]}})}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const capEl=document.getElementById('cap');
function caption(t){let c=null;for(const ch of CHUNKS){if(t>=ch.s-.06&&t<=ch.e+.2)c=ch}
  if(!c||HIDECAP(t)){capEl.innerHTML='';return}
  capEl.innerHTML=c.ws.map((w,i)=>{const on=t>=w.s-.03&&t<w.e+.05, fu=t<w.s-.03;const col=NEON[(CHUNKS.indexOf(c)+i)%5];
   return `<span class="w${on?' on':''}${fu?' fu':''}" style="--c:${col}">${esc(w.w.replace(/\.\.\.$/,'…'))}</span>`}).join('')}
// ---- matrix rain (deterministic)
const rc=document.getElementById('rain').getContext('2d');
const RCH='01{}()<>=;:$#@*+-/\\|constletfnasyncawaitgitPRCIアイウエオカキクケコサシスセソタチツテトナニヌネノ'.split('');
const COLS=Array.from({length:88},(_,i)=>({x:i*22+6,sp:260+((i*7919)%400),off:(i*104729)%1700,len:14+(i*31)%18,col:NEON[(i*3)%5]}));
function hsh(a,b){let h=(a*374761393+b*668265263)>>>0;h=(h^(h>>>13))*1274126177>>>0;return h}
function rain(t,on,mono){rc.clearRect(0,0,1920,1080);if(!on)return;rc.font='700 20px "Monaspace Neon"';
  for(const c of COLS){const head=((c.off+t*c.sp)%1700)-300;
    for(let k=0;k<c.len;k++){const y=head-k*24;if(y<-24||y>1100)continue;const ch=RCH[hsh(c.x,Math.floor((head-k*24)/24)*3+k*7+Math.floor(t*(k<2?12:3)))%RCH.length];
      const a=k===0?1:Math.max(0,1-k/c.len)*.8;rc.fillStyle=k===0?`rgba(255,255,255,${a})`:(mono?`rgba(63,185,80,${a})`:hexA(c.col,a));rc.fillText(ch,c.x,y)}}}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
// ---- mesh gradient (time-driven)
const blobs=[...document.querySelectorAll('#mesh .blob')];
const MESHP={cold:['#1E1B4B','#312E81','#0E7490','#4C1D95'],pain:['#7F1D1D','#831843','#4C1D95','#1E1B4B'],turn:['#0891B2','#7C3AED','#DB2777','#15803D'],reveal:['#7C3AED','#DB2777','#0891B2','#65A30D'],mywork:['#6D28D9','#0891B2','#DB2777','#1D4ED8'],worktree:['#0E7490','#6D28D9','#4D7C0F','#BE185D'],merge:['#7C3AED','#DB2777','#0891B2','#15803D'],power:['#9333EA','#0891B2','#DB2777','#CA8A04'],honest:['#CA8A04','#DB2777','#7C3AED','#0891B2'],next:['#0891B2','#7C3AED','#DB2777','#65A30D'],end:['#EA580C','#DB2777','#7C3AED','#CA8A04']};
function mesh(t,sec,on){document.getElementById('mesh').style.display=on?'block':'none';if(!on)return;const P=MESHP[sec];
  blobs.forEach((b,i)=>{const x=560+Math.sin(t*.45+i*1.7)*700+(i%2?500:-300), y=300+Math.cos(t*.38+i*2.3)*420+(i>1?300:-200);
    b.style.left=x+'px';b.style.top=y+'px';b.style.background=`radial-gradient(circle,${P[i]} 0%,${P[i]}AA 25%,transparent 65%)`})}
// ---- chrome
const stageEl=document.getElementById('stage'),grains=[...document.querySelectorAll('.grain')];
const SECORD=[...new Set(Object.values(SECS))];
window.seek=function(t,frame){
  tl.seek(t,false);
  let cur=CUTS[0];for(const c of CUTS){if(c.t<=t)cur=c}
  document.getElementById('c-sec').textContent=SECNAME[cur.sec];
  document.getElementById('chap').textContent='CH '+SECS[cur.sec]+'/11';
  document.getElementById('prog').style.width=(t/END*1920).toFixed(1)+'px';
  mesh(t,cur.sec,cur.mesh);rain(t,cur.rain,cur.sec==='worktree'||cur.sec==='merge'||cur.sec==='pain');
  caption(t);
  grains.forEach((g,i)=>g.style.display=(i===(frame??Math.round(t*FPS))%4)?'block':'none');
  const bp=((t-DROP)/beat)%1, on=t>DROP;
  world.style.transform=`scale(${on?1+.012*Math.exp(-((bp+1)%1)*7):1})`;
};
window.CUES=CUES;window.CUTS=CUTS;window.DURATION=END;
window.META={DROP,MUSIC_T0:DROP-8*beat*4,BREAK0:BREAK0,BREAK1:BREAK1,beat};
window.READY=document.fonts.ready.then(()=>{seek(0,0);return true});
</script>
