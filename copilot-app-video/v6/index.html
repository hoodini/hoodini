// ---- captions: ≤5-word chunks, pure timeline sets, never overlapping
const capEl=document.getElementById('cap');const CH=[];
for(const k of Object.keys(TLD.words)){let cur=[];const ws=TLD.words[k];
  ws.forEach((w,i)=>{cur.push(w);if(/[,.:?!]$/.test(w.w)||cur.length>=5||i===ws.length-1){CH.push(cur);cur=[]}})}
CH.forEach((c,j)=>{const s=Math.max(0,c[0].s-.05);let e=c[c.length-1].e+.25;if(CH[j+1])e=Math.min(e,CH[j+1][0].s-.06);if(HIDECAP(s))return;
  const div=document.createElement('div');div.className='chunk';
  div.innerHTML=`<span class="box">${c.map(w=>`<span class="w">${w.w.replace(/\.\.\.$/,'…')}</span>`).join(' ')}</span>`;capEl.appendChild(div);
  tl.set(div,{visibility:'visible'},s);tl.set(div,{visibility:'hidden'},Math.max(s+.2,e));
  [...div.querySelectorAll('.w')].forEach((sp,i)=>{tl.set(sp,{opacity:1,color:'#6A4BE0'},Math.max(s,c[i].s-.02));tl.set(sp,{color:'#1E1A3A'},c[i].e+.04)})});
// ---- line boil: redraw the ink wobble 8x per second (classic hand-drawn animation)
for(let k=0;k*0.125<END;k++)tl.set('.boil',{attr:{seed:1+(k%6)}},k*0.125);
tl.seek(0);
